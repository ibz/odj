name: Packages

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            slug: debian-trixie
          - image: ubuntu:24.04
            slug: ubuntu-24.04
          - image: ubuntu:26.04
            slug: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: packaging/debian/build.sh ${{ matrix.image }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.slug }}
          path: packaging/debian/dist/*/*.deb

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: packaging/arch/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/dist/*.pkg.tar.*

  release:
    needs: [deb, arch]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.pkg.tar.*
