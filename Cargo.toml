[package]
name = "odj"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Keyboard-driven DJ player for the terminal, inspired by the Pioneer CDJ-800"
repository = "https://github.com/ibz/odj"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cpal = { version = "0.18.2", features = ["pipewire"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["all"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
