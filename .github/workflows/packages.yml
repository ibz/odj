name: Packages

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            slug: debian-trixie
          - image: ubuntu:24.04
            slug: ubuntu-24.04
          - image: ubuntu:26.04
            slug: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: packaging/debian/build.sh ${{ matrix.image }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.slug }}
          path: packaging/debian/dist/*/*.deb

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: packaging/arch/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/dist/*.pkg.tar.*

  # Apple Silicon only, not an x86_64 leg too: GitHub's Intel macOS
  # runner pool has been shrinking as Apple itself no longer ships
  # Intel Macs, and jobs targeting it were seen queueing for over a day
  # with no sign of ever being picked up, while this leg ran immediately.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # pkg-config here is Homebrew's own, already configured to look in
      # Homebrew's own prefix — no PKG_CONFIG_PATH wiring needed for the
      # rubberband.pc it just installed alongside.
      - name: Install build dependencies
        run: brew install rubberband pkg-config

      - run: cargo build --workspace --release --target aarch64-apple-darwin

      - name: Archive binaries
        run: |
          mkdir -p dist
          tar -C target/aarch64-apple-darwin/release -czf dist/odj-macos-aarch64.tar.gz \
            odj-player odj-sampler odj-crates odj-mixer

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: dist/*.tar.gz

  release:
    needs: [deb, arch, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.pkg.tar.*
            dist/**/*.tar.gz
