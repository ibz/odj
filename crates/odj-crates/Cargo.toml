[package]
name = "odj-crates"
description = "Manages odj crates: create them, search/download tracks via yt-dlp, or add existing ones"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
odj-core.workspace = true
anyhow.workspace = true
ratatui.workspace = true
youtube_dl = "0.10"

[dev-dependencies]
# Also brings in its `tui::to_ansi` screenshot-dumping helper, shared with
# odj-player/odj-sampler's own screenshot tests — see app.rs.
odj-core = { workspace = true, features = ["test-util"] }
