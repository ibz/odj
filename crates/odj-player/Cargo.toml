[package]
name = "odj-player"
description = "Keyboard-driven DJ player for the terminal, inspired by Pioneer CDJ decks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = false

[dependencies]
odj-core.workspace = true
anyhow.workspace = true
midir.workspace = true
ratatui.workspace = true
tui-big-text = "0.8.10"

[dev-dependencies]
odj-core = { workspace = true, features = ["test-util"] }

[package.metadata.deb]
name = "odj"
maintainer = "Ioan Bizău <odj@ibz.me>"
copyright = "Ioan Bizău <odj@ibz.me>"
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
extended-description = "Keyboard-driven DJ player for the terminal, inspired by Pioneer CDJ decks."
assets = [
    ["target/release/odj-player", "usr/bin/", "755"],
    { dest = "usr/bin/odj", link_name = "odj-player" },
    ["../../packaging/odj-player.desktop", "usr/share/applications/", "644"],
    ["../../README.md", "usr/share/doc/odj/", "644"],
]
