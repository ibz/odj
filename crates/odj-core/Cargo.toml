[package]
name = "odj-core"
description = "Shared code of the odj apps: decoding, the cue library, audio output, file browsing, terminal UI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# Test helpers (synthetic tracks) for the apps' own tests.
test-util = []

[dependencies]
anyhow.workspace = true
blake3.workspace = true
libc.workspace = true
cpal.workspace = true
midir.workspace = true
ringbuf.workspace = true
serde.workspace = true
serde_json.workspace = true
symphonia.workspace = true
ratatui.workspace = true
rustfft.workspace = true

# Only on Linux: needs `libpipewire` via pkg-config, which doesn't exist
# on macOS — see `src/audio.rs`'s own `#[cfg(target_os = "linux")]`
# gating around every use of this.
[target.'cfg(target_os = "linux")'.dependencies]
pipewire.workspace = true
