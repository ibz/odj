[package]
name = "odj-downloader"
description = "Downloads tracks via yt-dlp for later use in odj-player"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
ratatui.workspace = true
youtube_dl = "0.10"

[dev-dependencies]
# Just for its `tui::to_ansi` screenshot-dumping helper, shared with
# odj-player/odj-sampler's own screenshot tests — see app.rs.
odj-core = { workspace = true, features = ["test-util"] }
